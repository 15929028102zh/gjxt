<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片URL测试</title>
</head>
<body>
    <h1>图片URL测试</h1>
    
    <h2>测试不同的URL格式:</h2>
    
    <h3>1. 原始URL（会404）:</h3>
    <img src="http://192.168.164.128:8080/files/images/20250827/c7c28a52040d44ce88d1b6cd6882751f.jpg" alt="原始URL" style="max-width: 200px; border: 1px solid red;">
    
    <h3>2. 修复后的URL（添加/api前缀）:</h3>
    <img src="http://192.168.164.128:8080/api/files/images/20250827/c7c28a52040d44ce88d1b6cd6882751f.jpg" alt="修复后的URL" style="max-width: 200px; border: 1px solid green;">
    
    <h3>测试用的图片URL解析函数:</h3>
    <div id="result"></div>
    
    <script>
        // 模拟图片URL解析函数
        function parseImageUrls(imageUrls) {
            if (!imageUrls) return []
            
            try {
                let urlList = []
                if (typeof imageUrls === 'string') {
                    // 首先尝试JSON解析
                    try {
                        const parsed = JSON.parse(imageUrls)
                        if (Array.isArray(parsed)) {
                            urlList = parsed
                        }
                    } catch (e) {
                        // JSON解析失败，尝试逗号分割
                        urlList = imageUrls.split(',').map(url => url.trim()).filter(url => url)
                    }
                } else if (Array.isArray(imageUrls)) {
                    urlList = imageUrls
                }
                
                // 转换为完整URL
                return urlList.map(url => {
                    if (url && url.startsWith('/')) {
                        return `http://192.168.42.128:8080/api${url}`
                    }
                    return url || ''
                }).filter(url => url)
            } catch (e) {
                console.error('解析图片URL失败:', e, '原始数据:', imageUrls)
                return []
            }
        }
        
        // 测试不同格式的输入
        const testCases = [
            '/files/images/20250827/c7c28a52040d44ce88d1b6cd6882751f.jpg',
            '["/files/images/20250827/c7c28a52040d44ce88d1b6cd6882751f.jpg"]',
            '/files/images/20250827/image1.jpg,/files/images/20250827/image2.jpg',
            '["\/files\/images\/20250827\/image1.jpg","\/files\/images\/20250827\/image2.jpg"]'
        ]
        
        const resultDiv = document.getElementById('result')
        testCases.forEach((testCase, index) => {
            const result = parseImageUrls(testCase)
            resultDiv.innerHTML += `<p><strong>测试 ${index + 1}:</strong><br>
                输入: ${testCase}<br>
                输出: ${JSON.stringify(result)}</p>`
        })
    </script>
</body>
</html>
