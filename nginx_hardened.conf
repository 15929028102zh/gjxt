# ============================================================
#  石油工业园区设备巡检系统 - Nginx 加固配置
#  目的: 解决 WebSocket 连接打满 worker_connections / 重连风暴
#
#  设计要点:
#   1) upstream keepalive: 复用上游 TCP 连接,大幅降低 nginx 与后端的连接数
#   2) 单独 location /api/ws/info: 限速 + 短连接,挡住探测风暴
#   3) 单独 location /api/ws/websocket: 长连接,带 idle/read timeout,限制每 IP 最大并发
#   4) 全局 limit_conn 防单 IP 占用全部连接
#   5) nginx 进程级调优: worker_connections + worker_rlimit_nofile
#
#  使用: 替换原 nginx_fixed.conf,执行 nginx -s reload 平滑生效
# ============================================================

events {
    # 单 worker 最大并发连接数
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # 进程级文件描述符上限
    worker_rlimit_nofile 65535;

    # 客户端请求体大小(图片上传)
    client_max_body_size 100m;
    client_body_buffer_size 128k;

    # ============================================================
    #  全局连接数限流(关键防打满)
    # ============================================================

    # 1) 按 IP 限制最大并发连接数
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_conn per_ip_conn 20;

    # 2) 按 IP 限制请求速率(/info 探测用)
    limit_req_zone $binary_remote_addr zone=per_ip_req:10m rate=30r/s;

    # 3) 全局最大并发连接数
    limit_conn_zone $server_name zone=global_conn:10m;

    # ============================================================
    #  上游后端 upstream 池(关键:keepalive)
    # ============================================================
    upstream backend {
        server 10.116.40.104:8081;
        keepalive 32;            # 32 个空闲连接池
        keepalive_requests 10000;# 单连接最多 10000 次请求后关闭重建
        keepalive_timeout 60s;   # 空闲连接超时
    }

    server {
        listen 3000;
        server_name 10.116.40.104;

        # 全局限制此 server 的总并发连接数
        limit_conn global_conn 8000;

        # ---------- 静态前端 ----------
        location / {
            root   D:/gjxt/admin/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ---------- /files/ 静态代理 ----------
        location /files/ {
            proxy_pass http://backend/api/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================
        #  WebSocket 端点(关键)
        #  Spring STOMP over SockJS 暴露以下子路径:
        #    /api/ws           - 主端点
        #    /api/ws/info      - SockJS info 探测
        #    /api/ws/websocket - WebSocket upgrade 真正承载 STOMP 帧
        #    /api/ws/{session}/xhr / xhr_streaming - 备用 transport
        #
        #  客户端限定只走 websocket,所以只照顾 /info 和 /websocket 两条
        # ============================================================

        # ---------- /api/ws/info(短连接 + 严格限速)----------
        location = /api/ws/info {
            proxy_pass http://backend/api/ws/info;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # 限速:每个 IP 每秒最多 5 次,缓冲 10
            limit_req zone=per_ip_req burst=10 nodelay;

            # 关闭 keepalive 让它立即释放
            proxy_set_header Connection close;

            add_header Cache-Control "public, max-age=10";
        }

        # ---------- /api/ws/websocket(长连接 + 每 IP 限流)----------
        location = /api/ws/websocket {
            proxy_pass http://backend/api/ws/websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 不缓存(实时)
            proxy_buffering off;

            # 长超时:超过 30 分钟无数据视为死连接
            # STOMP 25s 心跳会持续刷新这个计时器
            proxy_connect_timeout 30s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;

            proxy_request_buffering off;
        }

        # ---------- /api/ws/{session}/xhr(防 SockJS 退路)----------
        location ~ ^/api/ws/[^/]+/xhr(_streaming)?$ {
            proxy_pass http://backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            limit_req zone=per_ip_req burst=5 nodelay;
        }

        # ---------- /api/(通用 HTTP API)----------
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket upgrade 兜底
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------- Gzip ----------
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript
                   application/javascript application/xml+rss application/json;

        # ---------- 安全头 ----------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ---------- 错误页 ----------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
