server {  
    listen 3000;  
    server_name 10.116.40.104;  # 根据实际域名修改  
   
    # 前端静态文件服务  
    location / {  
        root D:/gjxt/admin/dist;  # 修改为正确的前端构建目录 
        index index.html index.htm;  
        try_files $uri $uri/ /index.html;  # 支持Vue Router的history模式  
          
        # 静态资源缓存配置  
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {  
            expires 1y;  
            add_header Cache-Control "public, immutable";  
        }  
    }  
      
    # 文件访问代理 - 将/files路径代理到后端的/api/files
    # 这个配置必须放在 /api/ 规则之前，因为nginx按顺序匹配location规则
    location /files/ {  
        proxy_pass http://10.116.40.104:8081/api/files/;    
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  
          
        # 文件下载超时设置  
        proxy_connect_timeout 30s;  
        proxy_send_timeout 60s;  
        proxy_read_timeout 60s;  
         
        # 文件缓存配置 
        expires 1y; 
        add_header Cache-Control "public, immutable"; 
    }  
      
    # 后端API代理（包含所有/api路径，包括文件上传和访问）
    location /api/ {  
        proxy_pass http://10.116.40.104:8081/api/;    
        proxy_set_header Host $host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $scheme;  
          
        # 超时设置（文件上传需要更长时间）
        proxy_connect_timeout 60s;  
        proxy_send_timeout 300s;  
        proxy_read_timeout 300s;  
          
        # 支持大文件上传
        client_max_body_size 100M;
          
        # 支持WebSocket（如果需要）  
        proxy_http_version 1.1;  
        proxy_set_header Upgrade $http_upgrade;  
        proxy_set_header Connection "upgrade";  
    }  
      
    # Gzip压缩配置  
    gzip on;  
    gzip_vary on;  
    gzip_min_length 1024;  
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;  
      
    # 安全头配置  
    add_header X-Frame-Options "SAMEORIGIN" always;  
    add_header X-XSS-Protection "1; mode=block" always;  
    add_header X-Content-Type-Options "nosniff" always;  
    add_header Referrer-Policy "no-referrer-when-downgrade" always;  
      
    # 错误页面  
    error_page 404 /index.html;  
    error_page 500 502 503 504 /50x.html;  
    location = /50x.html {  
        root /usr/share/nginx/html;  
    }  
}